<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AMASA Admin — Login</title><link rel="stylesheet" href="admin.css"><style>
.login-page{min-height:100vh;display:grid;place-items:center;padding:25px;background:linear-gradient(135deg,#0b1928,#244966)}.login-card{width:min(430px,94vw);background:#fff;border-radius:16px;padding:35px;box-shadow:0 30px 80px #0005}.login-logo{font-size:30px;font-weight:900;letter-spacing:.18em;color:#102437}.login-sub{font-size:10px;font-weight:900;letter-spacing:.16em;color:#b58a50;margin-top:5px}.login-card h1{margin:30px 0 8px}.login-card p{color:#6b7785;font-size:13px}.login-form{display:grid;gap:15px;margin-top:25px}.login-form label{display:grid;gap:7px;font-size:12px;font-weight:800}.login-form input{width:100%;padding:12px;border:1px solid #e2e7eb;border-radius:8px;box-sizing:border-box}.password-wrap{position:relative}.password-wrap input{padding-right:44px}.password-toggle{position:absolute;right:12px;bottom:9px;border:0!important;background:transparent!important;color:#6b7785!important;padding:3px!important;font-size:18px!important;line-height:1;cursor:pointer!important}.login-form button{border:0;border-radius:8px;padding:12px;background:#b58a50;color:#fff;font-weight:800;cursor:pointer}.login-msg{font-size:12px;color:#b83b3b;min-height:18px}.login-msg.ok{color:#27763e}.login-link{border:0;background:none;color:#8d6b3e;font-size:12px;font-weight:800;cursor:pointer;padding:4px;text-align:center}.hidden{display:none!important}.login-copyright{margin-top:22px;padding-top:14px;border-top:1px solid #e2e7eb;color:#8a949f;font-size:10px;line-height:1.5;text-align:center}
</style></head><body><main class="login-page"><section class="login-card"><div class="login-logo">AMASA</div><div class="login-sub">ADMIN PANEL</div>
<div id="loginView"><h1>Masuk Admin</h1><form class="login-form" id="loginForm"><label>Email<input id="email" name="email" type="email" autocomplete="username" required></label><label class="password-wrap">Password<input id="password" name="password" type="password" autocomplete="current-password" required><button type="button" class="password-toggle" aria-label="Tampilkan password" onclick="togglePassword('password',this)">👁</button></label><button type="button" id="manualLoginButton">Masuk</button><button type="button" class="login-link" id="forgotButton">Lupa Password?</button><div class="login-msg" id="msg"></div></form></div>
</section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const db=supabase.createClient("https://fysaxpqpqexjnlpkbwap.supabase.co","sb_publishable_DWRaEZTcNMjhglwN3nqCOw_pua8rsjD");
function togglePassword(id,btn){const input=document.getElementById(id);const show=input.type==="password";input.type=show?"text":"password";btn.textContent=show?"🙈":"👁";btn.setAttribute("aria-label",show?"Sembunyikan password":"Tampilkan password")}
async function checkAdmin(){const {data:{user},error:userError}=await db.auth.getUser();if(userError||!user)return false;const {data:admin,error}=await db.from("amasa_admins").select("user_id,role").eq("user_id",user.id).eq("role","admin").maybeSingle();return !error&&!!admin}

async function performManualLogin(){
  const msg=document.getElementById("msg");
  msg.className="login-msg";
  msg.textContent="Memproses...";
  const {error}=await db.auth.signInWithPassword({
    email:document.getElementById("email").value.trim(),
    password:document.getElementById("password").value
  });
  if(error){msg.textContent=error.message;return}
  if(!(await checkAdmin())){
    await db.auth.signOut();
    msg.textContent="Akses ditolak. Akun ini belum diberi role admin AMASA.";
    return
  }
  location.href="index.html";
}
document.getElementById("manualLoginButton").addEventListener("click",performManualLogin);
document.getElementById("forgotButton").onclick=()=>{const email=document.getElementById("email").value.trim();if(email)location.href="reset.html?email="+encodeURIComponent(email);else location.href="reset.html"};
</script></body></html>
