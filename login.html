<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AMASA Admin — Login</title><link rel="stylesheet" href="admin.css"><style>
.login-page{min-height:100vh;display:grid;place-items:center;padding:25px;background:linear-gradient(135deg,#0b1928,#244966)}.login-card{width:min(430px,94vw);background:#fff;border-radius:16px;padding:35px;box-shadow:0 30px 80px #0005}.login-logo{font-size:30px;font-weight:900;letter-spacing:.18em;color:#102437}.login-sub{font-size:10px;font-weight:900;letter-spacing:.16em;color:#b58a50;margin-top:5px}.login-card h1{margin:30px 0 8px}.login-card p{color:#6b7785;font-size:13px}.login-form{display:grid;gap:15px;margin-top:25px}.login-form label{display:grid;gap:7px;font-size:12px;font-weight:800}.login-form input{width:100%;padding:12px;border:1px solid #e2e7eb;border-radius:8px;box-sizing:border-box}.password-wrap{position:relative}.password-wrap input{padding-right:44px}.password-toggle{position:absolute;right:12px;bottom:9px;border:0!important;background:transparent!important;color:#6b7785!important;padding:3px!important;font-size:18px!important;line-height:1;cursor:pointer!important}.login-form button{border:0;border-radius:8px;padding:12px;background:#b58a50;color:#fff;font-weight:800;cursor:pointer}.google-login{display:flex;align-items:center;justify-content:center;gap:9px;background:#fff!important;color:#102437!important;border:1px solid #dfe5ea!important}.google-login span{font-size:18px;font-weight:900}.login-divider{display:flex;align-items:center;gap:10px;color:#9aa4ad;font-size:11px;font-weight:700}.login-divider::before,.login-divider::after{content:"";height:1px;background:#e2e7eb;flex:1}.login-msg{font-size:12px;color:#b83b3b;min-height:18px}.login-msg.ok{color:#27763e}.login-link{border:0;background:none;color:#8d6b3e;font-size:12px;font-weight:800;cursor:pointer;padding:4px;text-align:center}.hidden{display:none!important}.login-copyright{margin-top:22px;padding-top:14px;border-top:1px solid #e2e7eb;color:#8a949f;font-size:10px;line-height:1.5;text-align:center}
</style></head><body><main class="login-page"><section class="login-card"><div class="login-logo">AMASA</div><div class="login-sub">ADMIN PANEL</div>
<div id="loginView"><h1>Masuk Admin</h1><form class="login-form" id="loginForm"><label>Email<input id="email" name="email" type="email" autocomplete="username" required></label><label class="password-wrap">Password<input id="password" name="password" type="password" autocomplete="current-password" required><button type="button" class="password-toggle" aria-label="Tampilkan password" onclick="togglePassword('password',this)">👁</button></label><button type="button" id="manualLoginButton">Masuk</button><div class="login-divider">atau</div><button type="button" class="google-login" id="googleLoginButton"><span>G</span>Lanjut dengan Google</button><button type="button" class="login-link" id="forgotButton">Lupa Password?</button><div class="login-msg" id="msg"></div></form></div>
</section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const db=supabase.createClient("https://fysaxpqpqexjnlpkbwap.supabase.co","sb_publishable_DWRaEZTcNMjhglwN3nqCOw_pua8rsjD");
function togglePassword(id,btn){const input=document.getElementById(id);const show=input.type==="password";input.type=show?"text":"password";btn.textContent=show?"🙈":"👁";btn.setAttribute("aria-label",show?"Sembunyikan password":"Tampilkan password")}
async function checkAdmin(){const {data:{user},error:userError}=await db.auth.getUser();if(userError||!user)return false;const {data:admin,error}=await db.from("amasa_admins").select("user_id,role").eq("user_id",user.id).eq("role","admin").maybeSingle();return !error&&!!admin}
async function checkCoreApproval(){
  const {data:client,error:clientError}=await db.from("core_platform_clients").select("id,status").eq("module_slug","PRODUCT").eq("name","AMASA").maybeSingle();
  if(clientError||client?.status!=="ACTIVE") return false;

  const {data:{user},error:userError}=await db.auth.getUser();
  if(userError||!user?.email) return false;

  const {data:accessRows,error:accessError}=await db.from("amasa_core_access")
    .select("approval_status,is_active,created_at")
    .eq("module_slug","PRODUCT")
    .eq("client_name","AMASA")
    .eq("email",user.email.toLowerCase())
    .order("created_at",{ascending:false})
    .limit(1);

  if(accessError) return false;

  /* Jika akun belum memiliki baris akses, ajukan ulang persetujuan ke Core. */
  if(!accessRows || !accessRows.length){
    const {error:requestError}=await db.from("amasa_core_access").insert({
      user_id:user.id,
      email:user.email.toLowerCase(),
      owner_name:user.email,
      core_name:"PT ADIIMASA DISTRIBUSI INDONESIA",
      module_slug:"PRODUCT",
      client_name:"AMASA",
      role:"admin",
      approval_status:"PENDING",
      is_active:false
    });
    if(requestError){
      console.error("AMASA access request:",requestError);
      return false;
    }
    return "PENDING_REQUEST";
  }

  const access=accessRows[0];
  return String(access.approval_status||"").toUpperCase()==="APPROVED" && access.is_active===true;
}

async function performManualLogin(){
  const msg=document.getElementById("msg");
  msg.className="login-msg";
  msg.textContent="Memproses...";
  const {error}=await db.auth.signInWithPassword({
    email:document.getElementById("email").value.trim(),
    password:document.getElementById("password").value
  });
  if(error){msg.textContent="Gmail dan password salah, silakan coba lagi.";return}
  /* Login email/password memakai alur akses yang sama dengan Google:
     akun lama yang sudah admin langsung masuk, sedangkan client baru
     mengikuti approval Core lalu role admin dibuat otomatis. */
  const approvalResult=await checkCoreApproval();
  if(approvalResult==="PENDING_REQUEST"){
    await db.auth.signOut();
    msg.textContent="Permintaan akses sudah dikirim ke Core Adiimasa. Silakan tunggu persetujuan.";
    return
  }
  if(!approvalResult){
    await db.auth.signOut();
    msg.textContent="Akses Anda belum disetujui Core Adiimasa. Silakan tunggu persetujuan.";
    return
  }

  if(await checkAdmin()){
    location.href="index.html";
    return;
  }

  const {data:provisioned,error:provisionError}=await db.rpc("amasa_ensure_admin_from_core");
  if(provisionError || provisioned!==true || !(await checkAdmin())){
    await db.auth.signOut();
    msg.textContent="Akses Anda belum memiliki role admin.";
    return;
  }

  location.href="index.html";
}
async function handleGoogleReturn(){
  const {data:{session}}=await db.auth.getSession();
  if(!session)return;
  const msg=document.getElementById("msg");
  msg.className="login-msg";
  msg.textContent="Memeriksa akses...";

  /* Admin yang sudah terdaftar di amasa_admins tidak perlu melewati
     proses provisioning/approval ulang setelah login Google. */
  if(await checkAdmin()){
    location.href="index.html";
    return;
  }

  const approvalResult=await checkCoreApproval();
  if(approvalResult==="PENDING_REQUEST"){
    await db.auth.signOut();
    msg.textContent="Permintaan akses sudah dikirim ke Core Adiimasa. Silakan tunggu persetujuan.";
    return;
  }
  if(!approvalResult){
    await db.auth.signOut();
    msg.textContent="Akses Anda belum disetujui Core Adiimasa. Silakan tunggu persetujuan.";
    return;
  }
  /* Akun Google baru: setelah Core menyetujui, buat role admin secara otomatis. */
  const {data:provisioned,error:provisionError}=await db.rpc("amasa_ensure_admin_from_core");
  if(provisionError || provisioned!==true || !(await checkAdmin())){
    await db.auth.signOut();
    msg.textContent="Akses Anda belum memiliki role admin.";
    return;
  }
  location.href="index.html";
}
document.getElementById("manualLoginButton").addEventListener("click",performManualLogin);
document.getElementById("googleLoginButton").addEventListener("click",async()=>{
  const btn=document.getElementById("googleLoginButton");
  const msg=document.getElementById("msg");
  btn.disabled=true;
  btn.textContent="Menghubungkan...";
  msg.className="login-msg";
  msg.textContent="";
  const {error}=await db.auth.signInWithOAuth({
    provider:"google",
    options:{redirectTo:window.location.origin+window.location.pathname}
  });
  if(error){
    btn.disabled=false;
    btn.innerHTML="<span>G</span>Lanjut dengan Google";
    msg.textContent="Login dengan Google belum dapat digunakan. Silakan coba lagi.";
  }
});
document.getElementById("forgotButton").onclick=()=>{const email=document.getElementById("email").value.trim();if(email)location.href="reset.html?email="+encodeURIComponent(email);else location.href="reset.html"};
handleGoogleReturn();
</script></body></html>
